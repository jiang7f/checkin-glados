[project]
name = "checkin-glados"
version = "0.1.0"
description = "Multi-account GLaDOS daily check-in with concurrent execution, browser login and Feishu notifications"
readme = "README.md"
license = "MIT"
keywords = ["glados", "glados-checkin", "daily-checkin", "multi-account", "automation", "feishu", "cloakbrowser"]
requires-python = ">=3.11"
dependencies = [
  "browser-cookie3>=0.20.1",
  "cloakbrowser>=0.4.10",
  "httpx[http2,socks]>=0.24.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/jiang7f/checkin-glados"
Issues = "https://github.com/jiang7f/checkin-glados/issues"

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0"
]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
